<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Brain Trust &middot; Beer Tracker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="ambient-bg"></div>

  <nav class="nav">
    <div class="nav-inner">
      <a href="#/" class="nav-logo">
        <span class="logo-mark">&#127866;</span>
        <span class="logo-text">The Brain Trust</span>
      </a>
      <ul class="nav-links">
        <li><a href="#/" data-route="/">Tonight</a></li>
        <li><a href="#/leaderboard" data-route="/leaderboard">Hall of Fame</a></li>
        <li><a href="#/roster" data-route="/roster">Roster</a></li>
        <li><a href="#/log" data-route="/log">Log</a></li>
        <li><a href="#/lore" data-route="/lore">Lore</a></li>
      </ul>
      <div class="nav-session">
        <span class="session-dot" id="sessionDot"></span>
        <span id="sessionLabel">No session</span>
      </div>
    </div>
  </nav>

  <main id="app" class="app"></main>

  <footer class="footer">
    <p>The Brain Trust &middot; Drink responsibly &middot; Track ruthlessly</p>
  </footer>

  <!-- Templates -->
  <template id="tpl-home">
    <section class="hero">
      <div class="hero-content">
        <p class="hero-eyebrow">Tonight at the round table</p>
        <h1 class="hero-title">The Brain Trust</h1>
        <p class="hero-sub">Six minds. One mission. <span class="amber">Crush beers, track everything.</span></p>
        <div class="session-controls">
          <button id="startSessionBtn" class="btn btn-primary">Start a Session</button>
          <button id="endSessionBtn" class="btn btn-ghost" hidden>End Session</button>
          <input id="sessionName" class="session-input" placeholder="Session name (e.g. Friday Night)" hidden>
        </div>
      </div>
      <div class="hero-stats">
        <div class="hero-stat">
          <span class="hero-stat-num" id="heroNightTotal">0</span>
          <span class="hero-stat-label">Beers tonight</span>
        </div>
        <div class="hero-stat">
          <span class="hero-stat-num" id="heroAllTimeTotal">0</span>
          <span class="hero-stat-label">All-time</span>
        </div>
        <div class="hero-stat">
          <span class="hero-stat-num" id="heroSessions">0</span>
          <span class="hero-stat-label">Sessions logged</span>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2 class="section-title">Tonight's Tracker</h2>
        <p class="section-sub">Tap a card to add a beer. Hold or right-click to remove. Long press for beer style.</p>
      </div>
      <div class="tracker-grid" id="trackerGrid"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2 class="section-title">Live Leaderboard</h2>
        <p class="section-sub">Who's leading the round table tonight</p>
      </div>
      <div class="live-board" id="liveBoard"></div>
    </section>
  </template>

  <template id="tpl-leaderboard">
    <section class="section">
      <div class="section-head">
        <h2 class="section-title">Hall of Fame</h2>
        <p class="section-sub">All-time rankings, records, and bragging rights</p>
      </div>
      <div class="podium" id="podium"></div>

      <div class="grid-2">
        <div class="card">
          <div class="card-head">
            <h3>All-Time Beers per Member</h3>
            <span class="card-tag">Cumulative</span>
          </div>
          <div class="chart-wrap"><canvas id="chartAllTime"></canvas></div>
        </div>
        <div class="card">
          <div class="card-head">
            <h3>Average per Session</h3>
            <span class="card-tag">Pace</span>
          </div>
          <div class="chart-wrap"><canvas id="chartAvg"></canvas></div>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="card-head">
            <h3>Last 8 Sessions</h3>
            <span class="card-tag">Trend</span>
          </div>
          <div class="chart-wrap chart-tall"><canvas id="chartTrend"></canvas></div>
        </div>
        <div class="card">
          <div class="card-head">
            <h3>Beer Style Mix (Group)</h3>
            <span class="card-tag">Palate</span>
          </div>
          <div class="chart-wrap chart-tall"><canvas id="chartStyle"></canvas></div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h3>Records &amp; Awards</h3>
          <span class="card-tag">Folklore</span>
        </div>
        <div class="records" id="records"></div>
      </div>
    </section>
  </template>

  <template id="tpl-roster">
    <section class="section">
      <div class="section-head">
        <h2 class="section-title">The Roster</h2>
        <p class="section-sub">Six legends. Click a card to dive into their stat page.</p>
      </div>
      <div class="roster-grid" id="rosterGrid"></div>
    </section>
  </template>

  <template id="tpl-member">
    <section class="member-page" id="memberPage"></section>
  </template>

  <template id="tpl-log">
    <section class="section">
      <div class="section-head">
        <h2 class="section-title">The Log</h2>
        <p class="section-sub">Every beer, every session, in chronological order</p>
      </div>
      <div class="log-toolbar">
        <select id="logFilter" class="select">
          <option value="all">All members</option>
        </select>
        <button id="clearTonightBtn" class="btn btn-ghost btn-small">Clear tonight</button>
        <button id="resetAllBtn" class="btn btn-danger btn-small">Reset everything</button>
      </div>
      <div class="log-list" id="logList"></div>
    </section>
  </template>

  <template id="tpl-lore">
    <section class="section">
      <div class="section-head">
        <h2 class="section-title">Lore of the Brain Trust</h2>
        <p class="section-sub">Origin myths, sacred rituals, and inside jokes (mostly fictional, all canon)</p>
      </div>
      <div class="lore" id="loreContent"></div>
    </section>
  </template>

  <template id="tpl-404">
    <section class="section center">
      <h2 class="section-title">404 &mdash; Empty Pint</h2>
      <p>This page is as dry as a Tuesday night. <a href="#/">Head back to the bar</a>.</p>
    </section>
  </template>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
